name: Refresh GitHub cards

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_stats_card.py
      - scripts/gen_contrib_graph.py
      - .github/workflows/stats-card.yml

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          # A classic PAT with read:user works too; the default token is enough
          # for the public REST and GraphQL data these scripts read.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gen_stats_card.py
          python scripts/gen_contrib_graph.py

      # The previous card was generated by a third-party action that failed
      # silently and committed an SVG reading "Something went wrong!" every
      # day. Refuse to commit anything that does not look like a real card.
      - name: Validate output
        run: |
          for theme in dark light; do
            file="assets/readme/github-stats-$theme.svg"
            grep -q "GitHub at a glance" "$file" || { echo "::error::$file is not a valid card"; exit 1; }
            grep -qi "something went wrong\|maximum retries" "$file" && { echo "::error::$file contains an error card"; exit 1; }

            file="assets/readme/contrib-graph-$theme.svg"
            grep -q "Contribution activity" "$file" || { echo "::error::$file is not a valid graph"; exit 1; }
            grep -qi "can.t fetch any contribution" "$file" && { echo "::error::$file contains an error graph"; exit 1; }
          done
          echo "all four cards look valid"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/github-stats-*.svg assets/readme/contrib-graph-*.svg
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "Refresh GitHub cards [skip ci]"
          git push
