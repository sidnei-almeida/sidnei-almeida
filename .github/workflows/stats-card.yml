name: Refresh GitHub stats card

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_stats_card.py
      - .github/workflows/stats-card.yml

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats_card.py

      # The previous card was generated by a third-party action that failed
      # silently and committed an SVG reading "Something went wrong!" every
      # day. Refuse to commit anything that does not look like a real card.
      - name: Validate output
        run: |
          for theme in dark light; do
            file="assets/readme/github-stats-$theme.svg"
            grep -q "GitHub at a glance" "$file" || { echo "::error::$file is not a valid card"; exit 1; }
            grep -qi "something went wrong\|maximum retries" "$file" && { echo "::error::$file contains an error card"; exit 1; }
          done
          echo "both cards look valid"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/github-stats-dark.svg assets/readme/github-stats-light.svg
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "Refresh GitHub stats card [skip ci]"
          git push
